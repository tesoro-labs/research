<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1000" role="img" aria-labelledby="t d">
  <title id="t">Where tesoro stands in the 2026 stablecoin compliance landscape</title>
  <desc id="d">Seven regulatory frameworks bind six kinds of obliged entity. An autonomous agent is not an obliged entity under any of them, so when an agent spends, the exposure lands on the entity it transacts through. Three assumptions break: the originator is a person who acted, the customer can be onboarded, and monitoring baselines are built from human tempo. FATF R.16's required data set, verified against the 2012 to 2025 consolidated text, names whose money moved but never who instructed the movement, and the June 2025 revision narrowed the definition of originator from the account holder who allows a transfer to the one who requests it. IVMS101, the virtual-asset payload, has no initiating-party field at all; fiat pacs.008 has an optional one that cannot name an agent. Tesoro supplies attribution, a pre-execution verdict, the attributed control and anchored evidence. It does not supply screening, KYC, KYB, sanctions lists, Travel Rule transfer or compliance. It conforms to profile aegs-2 and does not conform to the stablecoin-1 profile, published in the standard on 28 August 2026, because it has no AML control.</desc>

  <rect width="1200" height="1000" fill="#fbfbfa"/>

  <g font-family="Arial, Helvetica, sans-serif">

    <!-- header -->
    <text x="40" y="52" font-size="32" font-weight="700" fill="#16161a">Where tesoro stands</text>
    <text x="40" y="78" font-size="14" fill="#5f5f68">Against the 2026 stablecoin compliance landscape &#8212; seven frameworks, six obliged entities, and the actor none of them name</text>

    <!-- band 1: frameworks -->
    <text x="40" y="118" font-size="11" font-weight="700" fill="#8c8c95" letter-spacing="1.6">SEVEN FRAMEWORKS BIND&#8230;</text>
    <g font-size="13" font-weight="700" fill="#2b4c7e" text-anchor="middle">
      <rect x="40"  y="130" width="152" height="42" rx="12" fill="#eaf0f8" stroke="#c9d8ec" stroke-width="1.5"/>
      <text x="116" y="156">FATF R.16</text>
      <rect x="205" y="130" width="152" height="42" rx="12" fill="#eaf0f8" stroke="#c9d8ec" stroke-width="1.5"/>
      <text x="281" y="156">GENIUS (US)</text>
      <rect x="370" y="130" width="152" height="42" rx="12" fill="#eaf0f8" stroke="#c9d8ec" stroke-width="1.5"/>
      <text x="446" y="156">MiCA (EU)</text>
      <rect x="535" y="130" width="152" height="42" rx="12" fill="#eaf0f8" stroke="#c9d8ec" stroke-width="1.5"/>
      <text x="611" y="156">FCA (UK)</text>
      <rect x="700" y="130" width="152" height="42" rx="12" fill="#eaf0f8" stroke="#c9d8ec" stroke-width="1.5"/>
      <text x="776" y="156">MAS (SG)</text>
      <rect x="865" y="130" width="152" height="42" rx="12" fill="#eaf0f8" stroke="#c9d8ec" stroke-width="1.5"/>
      <text x="941" y="156">HKMA (HK)</text>
      <rect x="1008" y="130" width="152" height="42" rx="12" fill="#eaf0f8" stroke="#c9d8ec" stroke-width="1.5"/>
      <text x="1084" y="156">VARA (AE)</text>
    </g>

    <!-- band 2: obliged entities -->
    <text x="40" y="212" font-size="11" font-weight="700" fill="#8c8c95" letter-spacing="1.6">&#8230;SIX KINDS OF OBLIGED ENTITY</text>
    <g font-size="13" fill="#16161a" text-anchor="middle">
      <rect x="40"  y="224" width="175" height="58" rx="12" fill="#ffffff" stroke="#e3e3df" stroke-width="2"/>
      <text x="127" y="249" font-weight="700">Banks</text><text x="127" y="268" font-size="11" fill="#5f5f68">adding stablecoins</text>
      <rect x="229" y="224" width="175" height="58" rx="12" fill="#ffffff" stroke="#e3e3df" stroke-width="2"/>
      <text x="316" y="249" font-weight="700">Issuers</text><text x="316" y="268" font-size="11" fill="#5f5f68">mint, redeem, reserve</text>
      <rect x="418" y="224" width="175" height="58" rx="12" fill="#ffffff" stroke="#e3e3df" stroke-width="2"/>
      <text x="505" y="249" font-weight="700">Payments</text><text x="505" y="268" font-size="11" fill="#5f5f68">move value for others</text>
      <rect x="607" y="224" width="175" height="58" rx="12" fill="#ffffff" stroke="#e3e3df" stroke-width="2"/>
      <text x="694" y="249" font-weight="700">Infrastructure</text><text x="694" y="268" font-size="11" fill="#5f5f68">custody and rails</text>
      <rect x="796" y="224" width="175" height="58" rx="12" fill="#ffffff" stroke="#e3e3df" stroke-width="2"/>
      <text x="883" y="249" font-weight="700">Wallets</text><text x="883" y="268" font-size="11" fill="#5f5f68">custodial or not</text>
      <rect x="985" y="224" width="175" height="58" rx="12" fill="#ffffff" stroke="#e3e3df" stroke-width="2"/>
      <text x="1072" y="249" font-weight="700">Card issuers</text><text x="1072" y="268" font-size="11" fill="#5f5f68">spend in stablecoins</text>
    </g>

    <!-- band 3: the agent, outside -->
    <!-- A bracket spanning the whole band, not an arrow into one box: an agent transacts through
         ANY of the six, and pointing at one of them would say something narrower than the claim. -->
    <path d="M 40 306 L 40 298 L 1160 298 L 1160 306" stroke="#a81c1c" stroke-width="2.5" fill="none"/>
    <path d="M 250 372 L 250 310" stroke="#a81c1c" stroke-width="3" fill="none" stroke-dasharray="7 5"/>
    <path d="M 244 314 L 250 300 L 256 314 Z" fill="#a81c1c"/>
    <text x="266" y="330" font-size="13" font-weight="700" fill="#a81c1c">transacts through &#8212; and the obligation stays with the entity</text>

    <rect x="40" y="372" width="420" height="72" rx="12" fill="#fdf0ef" stroke="#a81c1c" stroke-width="2.5"/>
    <text x="60" y="400" font-size="16" font-weight="700" fill="#a81c1c">An autonomous agent that spends</text>
    <text x="60" y="424" font-size="13" fill="#16161a">Not an obliged entity in any of the seven. No legal personality.</text>

    <rect x="484" y="372" width="676" height="72" rx="12" fill="#ffffff" stroke="#e3e3df" stroke-width="2"/>
    <text x="504" y="398" font-size="13" fill="#16161a">This is correct, not an omission &#8212; an agent cannot hold a licence or be a VASP.</text>
    <text x="504" y="422" font-size="13" font-weight="700" fill="#16161a">The exposure lands on the obliged entity, and it arrives without a category.</text>

    <!-- band 4: the three broken assumptions -->
    <text x="40" y="486" font-size="11" font-weight="700" fill="#8c8c95" letter-spacing="1.6">THREE ASSUMPTIONS THE FRAMEWORKS REST ON, AND HOW EACH BREAKS</text>
    <g>
      <rect x="40" y="498" width="360" height="118" rx="12" fill="#ffffff" stroke="#e3e3df" stroke-width="2"/>
      <text x="60" y="524" font-size="14" font-weight="700" fill="#16161a">The originator acted</text>
      <text x="60" y="548" font-size="12.5" fill="#5f5f68">R.16&#8217;s required set names whose money</text>
      <text x="60" y="566" font-size="12.5" fill="#5f5f68">moved, never who instructed it. IVMS101</text>
      <text x="60" y="584" font-size="12.5" fill="#5f5f68">has no initiator field either. June 2025</text>
      <text x="60" y="602" font-size="12.5" fill="#5f5f68">narrowed &#8220;originator&#8221; from <tspan font-style="italic">allows</tspan> to <tspan font-style="italic">requests</tspan>.</text>

      <rect x="420" y="498" width="360" height="118" rx="12" fill="#ffffff" stroke="#e3e3df" stroke-width="2"/>
      <text x="440" y="524" font-size="14" font-weight="700" fill="#16161a">The customer can be onboarded</text>
      <text x="440" y="548" font-size="12.5" fill="#5f5f68">An agent has no documents, is not a</text>
      <text x="440" y="566" font-size="12.5" fill="#5f5f68">beneficial owner, and is not a synthetic</text>
      <text x="440" y="584" font-size="12.5" fill="#5f5f68">identity either. The existing categories</text>
      <text x="440" y="602" font-size="12.5" fill="#5f5f68">do not contain it.</text>

      <rect x="800" y="498" width="360" height="118" rx="12" fill="#ffffff" stroke="#e3e3df" stroke-width="2"/>
      <text x="820" y="524" font-size="14" font-weight="700" fill="#16161a">Baselines match human tempo</text>
      <text x="820" y="548" font-size="12.5" fill="#5f5f68">500 micropayments a day is normal or</text>
      <text x="820" y="566" font-size="12.5" fill="#5f5f68">alarming and nothing says which. On</text>
      <text x="820" y="584" font-size="12.5" fill="#5f5f68">x402 the average payment is $0.32</text>
      <text x="820" y="602" font-size="12.5" fill="#5f5f68">across 75M a month.</text>
    </g>

    <!-- band 5: supplies / does not -->
    <rect x="40" y="648" width="555" height="212" rx="12" fill="#ffffff" stroke="#1f7a4d" stroke-width="2.5"/>
    <text x="62" y="678" font-size="15" font-weight="700" fill="#1f7a4d">What tesoro supplies</text>
    <g font-size="13" fill="#16161a">
      <text x="62" y="706">Which accountable human authority the agent acted under</text>
      <text x="62" y="730">A deterministic verdict <tspan font-weight="700">before</tspan> the payment, in microseconds</text>
      <text x="62" y="754"><tspan font-weight="700">Which control</tspan> permitted or refused it &#8212; required, and scored</text>
      <text x="62" y="778">Hash-chained evidence, externally anchorable</text>
      <text x="62" y="802">Cumulative envelopes per day, month, counterparty, resource</text>
      <text x="62" y="826">Delegation clamped to the narrower of child and parent</text>
    </g>

    <rect x="619" y="648" width="541" height="212" rx="12" fill="#ffffff" stroke="#a81c1c" stroke-width="2.5"/>
    <text x="641" y="678" font-size="15" font-weight="700" fill="#a81c1c">What it does not, and will not</text>
    <g font-size="13" fill="#16161a">
      <text x="641" y="706">Sanctions or PEP screening &#8212; no list, no matching</text>
      <text x="641" y="730">KYC, KYB, beneficial ownership</text>
      <text x="641" y="754">Travel Rule transfer (it defines a <tspan font-weight="700">record</tspan>, not a transfer)</text>
      <text x="641" y="778">Case management, SAR filing</text>
      <text x="641" y="802">Custody, keys, chain interaction, address validation</text>
      <text x="641" y="826" font-weight="700" fill="#a81c1c">Regulatory compliance. None is claimed or sought.</text>
    </g>

    <!-- band 6: honest standing -->
    <rect x="40" y="882" width="1120" height="78" rx="12" fill="#f6f6f3" stroke="#e3e3df" stroke-width="2"/>
    <circle cx="70" cy="912" r="7" fill="#1f7a4d"/>
    <text x="88" y="917" font-size="13.5" fill="#16161a"><tspan font-weight="700">Conforms to profile aegs-2</tspan> &#8212; counterparty-aware, agent identity exercised, evidence chained. Scored 7/7 by the conformance suite.</text>
    <circle cx="70" cy="941" r="7" fill="#a81c1c"/>
    <text x="88" y="946" font-size="13.5" fill="#16161a"><tspan font-weight="700">Does not conform to <tspan font-style="italic">stablecoin-1</tspan></tspan> &#8212; the vertical profile it published itself. Requires an AML assessment; there is no AML control. Stated, not worked around.</text>

    <text x="40" y="984" font-size="11" fill="#8c8c95">Landscape from &#8220;Stablecoin compliance in 2026&#8221;, Sumsub, 66pp. Scores from sealed record EXP-010. An AEGL consumes compliance signals; it does not produce them.</text>
  </g>
</svg>
