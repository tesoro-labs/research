<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-labelledby="fig-attribution-tie-title fig-attribution-tie-desc">
<title id="fig-attribution-tie-title">Same verdict, different attributed control</title>
<desc id="fig-attribution-tie-desc">Two evaluation orders of a budget envelope and a sanctions screen both reach REJECT, but the record attributes the refusal to whichever control ran first.</desc>
<defs>
<marker id="fig-attribution-tie-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
<marker id="fig-attribution-tie-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
</defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="30" y="22" fill="#4f5d75" font-size="8" font-family="'Cascadia Mono', Consolas, ui-monospace, Menlo, monospace" font-weight="400" text-anchor="start" letter-spacing="0.14em">TWO CONTROLS BOTH REFUSE. ORDER DECIDES WHICH ONE THE RECORD NAMES.</text>
<text x="40" y="52" fill="#4f5d75" font-size="8" font-family="'Cascadia Mono', Consolas, ui-monospace, Menlo, monospace" font-weight="400" text-anchor="start" letter-spacing="0.12em">ORDER A: BUDGET RUNS FIRST</text>
<line x1="200" y1="92" x2="254" y2="92" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#fig-attribution-tie-arrow)"/>
<line x1="420" y1="92" x2="474" y2="92" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#fig-attribution-tie-arrow)"/>
<rect x="40" y="64" width="160" height="56" rx="6" fill="#ffffff"/>
<rect x="40" y="64" width="160" height="56" rx="6" fill="#ffffff" stroke="#1f2430" stroke-width="1"/>
<text x="120.0" y="90.0" fill="#1f2430" font-size="12" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-weight="600" text-anchor="middle">Budget envelope</text>
<text x="120.0" y="106.0" fill="#4f5d75" font-size="9" font-family="'Cascadia Mono', Consolas, ui-monospace, Menlo, monospace" font-weight="400" text-anchor="middle">REJECT, narrows</text>
<rect x="260" y="64" width="160" height="56" rx="6" fill="#ffffff"/>
<rect x="260" y="64" width="160" height="56" rx="6" fill="#ffffff" stroke="#1f2430" stroke-width="1"/>
<text x="340.0" y="90.0" fill="#1f2430" font-size="12" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-weight="600" text-anchor="middle">Sanctions screen</text>
<text x="340.0" y="106.0" fill="#4f5d75" font-size="9" font-family="'Cascadia Mono', Consolas, ui-monospace, Menlo, monospace" font-weight="400" text-anchor="middle">REJECT, no change</text>
<rect x="480" y="64" width="240" height="56" rx="6" fill="#ffffff"/>
<rect x="480" y="64" width="240" height="56" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
<text x="600.0" y="90.0" fill="#1f2430" font-size="12" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-weight="600" text-anchor="middle">Verdict: REJECT</text>
<text x="600.0" y="106.0" fill="#4f5d75" font-size="9" font-family="'Cascadia Mono', Consolas, ui-monospace, Menlo, monospace" font-weight="400" text-anchor="middle">record names: budget</text>
<text x="40" y="160" fill="#4f5d75" font-size="8" font-family="'Cascadia Mono', Consolas, ui-monospace, Menlo, monospace" font-weight="400" text-anchor="start" letter-spacing="0.12em">ORDER B: SANCTIONS RUNS FIRST</text>
<line x1="200" y1="200" x2="254" y2="200" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#fig-attribution-tie-arrow)"/>
<line x1="420" y1="200" x2="474" y2="200" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#fig-attribution-tie-arrow)"/>
<rect x="40" y="172" width="160" height="56" rx="6" fill="#ffffff"/>
<rect x="40" y="172" width="160" height="56" rx="6" fill="#ffffff" stroke="#1f2430" stroke-width="1"/>
<text x="120.0" y="198.0" fill="#1f2430" font-size="12" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-weight="600" text-anchor="middle">Sanctions screen</text>
<text x="120.0" y="214.0" fill="#4f5d75" font-size="9" font-family="'Cascadia Mono', Consolas, ui-monospace, Menlo, monospace" font-weight="400" text-anchor="middle">REJECT, narrows</text>
<rect x="260" y="172" width="160" height="56" rx="6" fill="#ffffff"/>
<rect x="260" y="172" width="160" height="56" rx="6" fill="#ffffff" stroke="#1f2430" stroke-width="1"/>
<text x="340.0" y="198.0" fill="#1f2430" font-size="12" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-weight="600" text-anchor="middle">Budget envelope</text>
<text x="340.0" y="214.0" fill="#4f5d75" font-size="9" font-family="'Cascadia Mono', Consolas, ui-monospace, Menlo, monospace" font-weight="400" text-anchor="middle">REJECT, no change</text>
<rect x="480" y="172" width="240" height="56" rx="6" fill="#ffffff"/>
<rect x="480" y="172" width="240" height="56" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
<text x="600.0" y="198.0" fill="#1f2430" font-size="12" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-weight="600" text-anchor="middle">Verdict: REJECT</text>
<text x="600.0" y="214.0" fill="#4f5d75" font-size="9" font-family="'Cascadia Mono', Consolas, ui-monospace, Menlo, monospace" font-weight="400" text-anchor="middle">record names: sanctions</text>
<text x="380" y="272" fill="#1f2430" font-size="13" font-family="Charter, 'Bitstream Charter', Georgia, Cambria, serif" font-weight="400" text-anchor="middle" font-style="italic">Same verdict both ways; a different control on the record. A declared dispositive control (sanctions) removes the ambiguity.</text>
</svg>
