<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" width="760" height="560" role="img" aria-labelledby="fig-payment-path-title fig-payment-path-desc">
<title id="fig-payment-path-title">Where a spending control can sit on one x402 payment</title>
<desc id="fig-payment-path-desc">Sequence of one x402 payment between agent, x402 client, agent gateway, paid tool and facilitator, marking six places a spending control can act; the pre-tool hook acts before the seller has named a price.</desc>
